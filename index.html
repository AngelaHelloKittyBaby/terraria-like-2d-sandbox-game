<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Terraria-Like 2D Sandbox</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI',sans-serif; }
  #game { display:block; margin:0 auto; background:#87CEEB; image-rendering:pixelated; cursor:crosshair; }
  #ui { position:fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; }
  #hint { position:fixed; left:8px; top:8px; color:#fff; font-size:13px; text-shadow:1px 1px 2px #000; line-height:1.5; background:rgba(0,0,0,0.35); padding:6px 10px; border-radius:4px; }
  #craftMenu { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:#3a2a1a; border:3px solid #6b4a2a; border-radius:6px; padding:12px; display:none; pointer-events:auto; color:#fff; min-width:320px; max-height:80vh; overflow-y:auto; }
  #craftMenu h3 { text-align:center; margin-bottom:8px; color:#ffd86b; }
  .recipe { display:flex; justify-content:space-between; align-items:center; padding:6px 8px; margin:4px 0; background:#2a1a0a; border:1px solid #5a3a1a; border-radius:4px; cursor:pointer; }
  .recipe:hover { background:#4a3a1a; }
  .recipe .name { font-size:14px; }
  .recipe .cost { font-size:12px; color:#bbb; }
  #info { position:fixed; right:8px; top:8px; color:#fff; font-size:13px; text-shadow:1px 1px 2px #000; text-align:right; background:rgba(0,0,0,0.35); padding:6px 10px; border-radius:4px; }
  #deathScreen { position:fixed; left:0; top:0; width:100%; height:100%; background:rgba(80,0,0,0.7); display:none; align-items:center; justify-content:center; flex-direction:column; color:#fff; pointer-events:auto; }
  #deathScreen h1 { font-size:48px; margin-bottom:16px; }
  #deathScreen button { padding:10px 24px; font-size:18px; cursor:pointer; background:#8b3a3a; color:#fff; border:none; border-radius:4px; }
  #deathScreen button:hover { background:#ab4a4a; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="hint">
    <b>操作说明</b><br>
    A/D 或 ←/→ : 移动<br>
    空格 / W : 跳跃<br>
    鼠标左键 : 挖掘 / 攻击<br>
    鼠标右键 : 放置方块<br>
    滚轮 / 1-9 : 选择物品栏<br>
    E : 打开/关闭合成菜单<br>
    F : 切换攻击/挖掘模式<br>
    在工作台附近可合成更多物品
  </div>
  <div id="info"></div>
  <div id="craftMenu"><h3>合成 (Crafting)</h3><div id="recipeList"></div></div>
  <div id="deathScreen"><h1>你死了</h1><p id="deathInfo" style="margin-bottom:20px;"></p><button onclick="restartGame()">重生</button></div>
</div>
<script src="terraria-game/game.js"></script>
</body>
</html>
